title: "Tech Notes"
description: "プロフィール、制作物、ブログ・技術メモをまとめる個人サイトです。"
lang: ja-JP
timezone: Asia/Tokyo

# GitHub Pages settings:
# User/Organization site: https://your-name.github.io -> baseurl: ""
# Project site: https://your-name.github.io/repository-name -> baseurl: "/repository-name"
url: "https://atyuyaya.github.io"
baseurl: ""

author:
  name: ""
  email: ""
  github: "atyuyaya"
  x: ""

permalink: /notes/:title/
markdown: kramdown

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: ""
  - scope:
      path: ""
    values:
      layout: page

analytics:
  google_id: ""

adsense:
  client: "ca-pub-3269956574922124"
  slots:
    home_inline: ""
    post_top: ""
    post_bottom: ""

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md

