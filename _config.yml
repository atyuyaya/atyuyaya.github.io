title: "Your Name | Tech Notes"
description: "プロフィール、制作物、ブログ・技術メモをまとめる個人サイトです。"
lang: ja-JP
timezone: Asia/Tokyo

# GitHub Pages settings:
# User/Organization site: https://your-name.github.io -> baseurl: ""
# Project site: https://your-name.github.io/repository-name -> baseurl: "/repository-name"
url: "https://your-name.github.io"
baseurl: ""

author:
  name: "Your Name"
  email: ""
  github: "your-github-name"
  x: ""

permalink: /notes/:title/
markdown: kramdown

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "Your Name"
  - scope:
      path: ""
    values:
      layout: page

analytics:
  google_id: ""

adsense:
  client: ""

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md

