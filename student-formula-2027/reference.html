<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>参照資料ビューア | 学生フォーミュラ2027 車検ガイド</title>
  <style>
    :root { --ink: #16201d; --muted: #5e6965; --paper: #f6f4ee; --line: #d9d6ca; --track: #1f6f78; --amber: #d89b2b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; }
    a { color: inherit; text-decoration: none; }
    header { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 18px clamp(16px,4vw,48px); background: #16201d; color: #fff; }
    header h1 { margin: 0; font-size: clamp(20px,3vw,34px); letter-spacing: 0; }
    header p { margin: 6px 0 0; color: rgba(255,255,255,.72); line-height: 1.6; }
    .back { min-height: 40px; display: inline-flex; align-items: center; border: 1px solid rgba(255,255,255,.24); border-radius: 6px; padding: 0 14px; font-weight: 900; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px clamp(16px,4vw,48px); border-bottom: 1px solid var(--line); background: #fff; }
    .chip { min-height: 34px; display: inline-flex; align-items: center; border: 1px solid rgba(31,111,120,.28); border-radius: 6px; padding: 0 10px; background: #eef7f5; color: #12484f; font-weight: 900; }
    .openPdf { min-height: 34px; display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; background: #fbfaf6; font-weight: 900; }
    .viewer { height: calc(100vh - 148px); min-height: 520px; padding: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .error { padding: 28px clamp(16px,4vw,48px); color: #8b2d21; font-weight: 900; }
    @media (max-width: 760px) { header { grid-template-columns: 1fr; } .viewer { height: calc(100vh - 212px); min-height: 460px; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="title">参照資料ビューア</h1>
      <p id="summary">Formula SAE 2027 Draft Rules の該当ページをサイト内PDFから開きます。</p>
    </div>
    <a class="back" href="index.html">ガイドへ戻る</a>
  </header>
  <div class="toolbar" id="toolbar"></div>
  <main class="viewer" id="viewer"></main>
  <script>
    const params = new URLSearchParams(location.search);
    const requestedRule = params.get("rule") || "IN.1";
    const toolbar = document.getElementById("toolbar");
    const viewer = document.getElementById("viewer");
    const title = document.getElementById("title");
    const summary = document.getElementById("summary");

    function normalizeRule(rule) {
      return rule.split("-")[0].trim();
    }

    async function loadReference() {
      const refs = await fetch("refs.json").then((response) => response.json());
      const ref = refs[requestedRule] || refs[normalizeRule(requestedRule)];
      if (!ref) {
        title.textContent = requestedRule;
        viewer.innerHTML = '<div class="error">この参照番号のページ対応がまだ登録されていません。</div>';
        return;
      }
      const pdfUrl = ref.file + "#page=" + ref.page;
      title.textContent = requestedRule + " / Page " + ref.page;
      summary.textContent = ref.source + " をサイト内PDFから表示しています。PDFビューアの仕様により、ページ位置が数秒遅れて反映される場合があります。";
      toolbar.innerHTML =
        '<span class="chip">' + requestedRule + '</span>' +
        '<span class="chip">PDF Page ' + ref.page + '</span>' +
        '<a class="openPdf" href="' + pdfUrl + '" target="_blank" rel="noopener noreferrer">PDFを別タブで開く</a>';
      viewer.innerHTML = '<iframe title="' + requestedRule + ' reference" src="' + pdfUrl + '"></iframe>';
    }

    loadReference().catch(() => {
      viewer.innerHTML = '<div class="error">参照資料を読み込めませんでした。</div>';
    });
  </script>
</body>
</html>
