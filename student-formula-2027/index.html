<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学生フォーミュラ2027 車検ガイド</title>
  <meta name="description" content="パスワード付きの学生フォーミュラ2027車検ガイド">
  <style>
    :root { --ink: #16201d; --muted: #5e6965; --paper: #f6f4ee; --panel: #ffffff; --line: #d9d6ca; --track: #1f6f78; --track-dark: #12484f; --amber: #d89b2b; --red: #b64b3d; --green: #2f7d55; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; }
    body.unlocked { padding-bottom: 3.1em; }
    a { color: inherit; text-decoration: none; }
    .lock { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(120deg, rgba(22,32,29,.94), rgba(18,72,79,.88)), repeating-linear-gradient(135deg, rgba(255,255,255,.08) 0 1px, transparent 1px 18px), #16201d; color: #fff; }
    .lockBox { width: min(560px, 100%); border: 1px solid rgba(255,255,255,.22); border-radius: 8px; padding: clamp(22px, 5vw, 42px); background: rgba(255,255,255,.08); }
    .lockBox h1 { margin: 0 0 14px; font-size: clamp(32px, 6vw, 56px); line-height: 1.05; letter-spacing: 0; }
    .lockBox p { color: rgba(255,255,255,.78); line-height: 1.8; }
    .passRow { display: flex; gap: 10px; margin-top: 24px; }
    input { min-width: 0; flex: 1; min-height: 48px; border: 1px solid rgba(255,255,255,.35); border-radius: 6px; padding: 0 14px; background: rgba(255,255,255,.92); color: #16201d; font-size: 16px; }
    button { min-height: 48px; border: 0; border-radius: 6px; padding: 0 18px; background: var(--amber); color: #1a1405; font-weight: 900; cursor: pointer; }
    .error { min-height: 24px; margin-top: 12px; color: #ffd1c8; font-weight: 800; }
    main { min-height: 100vh; }
    .hero { min-height: 92vh; padding: 24px clamp(18px, 4vw, 64px) 56px; background: linear-gradient(120deg, rgba(22,32,29,.92), rgba(18,72,79,.84)), repeating-linear-gradient(135deg, rgba(255,255,255,.08) 0 1px, transparent 1px 18px), #16201d; color: #fff; display: flex; flex-direction: column; justify-content: space-between; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    nav a { min-width: 54px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,.24); border-radius: 6px; color: rgba(255,255,255,.88); font-size: 13px; }
    .heroGrid { display: grid; grid-template-columns: minmax(0,1fr) minmax(280px,380px); gap: clamp(28px,6vw,92px); align-items: end; max-width: 1180px; width: 100%; }
    .eyebrow { margin: 0 0 14px; color: var(--amber); font-size: 13px; font-weight: 800; letter-spacing: 0; text-transform: uppercase; }
    h1,h2,h3,p { margin-top: 0; }
    h1 { max-width: 900px; margin-bottom: 24px; font-size: clamp(40px,6.2vw,86px); line-height: 1.08; letter-spacing: 0; text-wrap: balance; }
    .titleLine { display: block; white-space: nowrap; }
    .lead { max-width: 790px; color: rgba(255,255,255,.86); font-size: clamp(16px,2vw,20px); line-height: 1.9; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    .actions a { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; padding: 0 18px; font-weight: 800; }
    .primary { background: var(--amber); color: #1a1405; }
    .secondary { border: 1px solid rgba(255,255,255,.32); color: #fff; }
    .statusPanel { border: 1px solid rgba(255,255,255,.22); border-radius: 8px; padding: 22px; background: rgba(255,255,255,.08); }
    .statusPanel span { display: block; margin-bottom: 16px; color: rgba(255,255,255,.7); font-size: 13px; }
    .statusPanel strong { display: block; margin-bottom: 12px; color: #ffe0a1; font-size: 28px; }
    .statusPanel p { margin-bottom: 0; color: rgba(255,255,255,.82); line-height: 1.7; }
    .sourceBand,.auditSection,.tabSection,.numberSection,.checkSection,footer { padding: 48px clamp(18px,4vw,64px); }
    .sourceBand { display: grid; grid-template-columns: minmax(0,1fr) minmax(260px,360px); gap: 32px; align-items: center; background: #fff; border-bottom: 1px solid var(--line); }
    .sourceBand h2,.sectionHead h2 { margin-bottom: 12px; font-size: clamp(28px,4vw,48px); letter-spacing: 0; }
    .sourceBand p,.panelIntro p,.numberCard p,footer p { color: var(--muted); line-height: 1.85; }
    .sourceLinks { display: grid; gap: 10px; }
    .sourceLinks a { display: flex; min-height: 44px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 6px; padding: 0 14px; background: #fbfaf6; font-weight: 800; }
    .sourceLinks a::after { content: ">"; color: var(--track); }
    .auditSection,.tabSection,.numberSection { max-width: 1240px; margin: 0 auto; }
    .sectionHead { margin-bottom: 28px; }
    .sectionHead > p:not(.eyebrow) { max-width: 820px; color: var(--muted); line-height: 1.8; }
    .auditGrid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; }
    .auditCard { min-height: 150px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--line); border-radius: 8px; padding: 16px; background: #fff; }
    .auditCard span { color: var(--green); font-size: 13px; font-weight: 900; }
    .auditCard p { margin: 12px 0 16px; color: #26332f; line-height: 1.65; font-weight: 800; }
    .tabs { border: 1px solid var(--line); border-radius: 8px; background: #fff; overflow: hidden; }
    .tabLabels { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); background: #16201d; }
    .tabButton { min-height: 54px; border-radius: 0; border-right: 1px solid rgba(255,255,255,.16); background: #16201d; color: rgba(255,255,255,.74); }
    .tabButton.active { background: var(--amber); color: #1a1405; }
    .tabPanels { padding: clamp(20px,4vw,34px); }
    .tabPanel { display: none; }
    .tabPanel.active { display: block; }
    .panelIntro { max-width: 900px; margin-bottom: 24px; }
    .panelIntro span,.numberCard span { color: var(--red); font-size: 13px; font-weight: 900; }
    .panelIntro h3 { margin: 6px 0 12px; font-size: clamp(28px,4vw,48px); letter-spacing: 0; }
    .detailGrid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }
    .detailCard { border: 1px solid var(--line); border-radius: 8px; padding: 20px; background: #fbfaf6; }
    .detailCard h4 { margin: 0 0 14px; font-size: 20px; }
    .detailCard ul { display: grid; gap: 8px; margin: 0 0 16px; padding: 0; list-style: none; }
    .detailCard li { position: relative; padding-left: 22px; color: #2b3632; line-height: 1.72; overflow-wrap: anywhere; }
    .detailCard li::before { content: ""; position: absolute; left: 0; top: .73em; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .detailCard small,.numberCard small { color: var(--track-dark); font-weight: 900; }
    .refList { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--track-dark); }
    .refLink { display: inline-flex; min-height: 28px; align-items: center; border: 1px solid rgba(31,111,120,.28); border-radius: 6px; padding: 0 8px; background: #eef7f5; color: var(--track-dark); font-weight: 900; }
    .refLink:hover { background: var(--track); color: #fff; }
    .numberSection { padding-top: 18px; }
    .numberGrid { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 12px; }
    .numberCard { min-height: 190px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--line); border-radius: 8px; padding: 18px; background: #fff; }
    .numberCard strong { display: block; margin: 12px 0; color: var(--track-dark); font-size: 26px; line-height: 1.2; }
    .numberCard p { margin-bottom: 14px; font-size: 14px; }
    .checkSection { background: #e8ede6; max-width: none; }
    .tableWrap { overflow-x: auto; border: 1px solid #cbd4cb; border-radius: 8px; background: #fff; }
    table { width: 100%; min-width: 720px; border-collapse: collapse; }
    th,td { padding: 16px; text-align: left; border-bottom: 1px solid #e4e4de; line-height: 1.6; }
    th { background: #16201d; color: #fff; font-size: 13px; }
    td:first-child { width: 110px; color: var(--red); font-weight: 900; }
    td:last-child { width: 150px; color: var(--track-dark); font-weight: 800; }
    footer { background: #16201d; color: #fff; }
    footer p { max-width: 980px; margin-bottom: 0; color: rgba(255,255,255,.76); }
    .rallyRunner { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; height: 3em; overflow: hidden; pointer-events: none; background: linear-gradient(to top, rgba(22,32,29,.18), rgba(22,32,29,0)); }
    .rallyCar { position: absolute; left: -8.3em; bottom: .12em; width: 8em; height: 2.55em; animation: driveAcross 8.5s linear infinite; }
    .rallyCarImage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
    .rallyWheel { position: absolute; bottom: .08em; width: .48em; height: .48em; border: 1px solid rgba(10,10,10,.8); border-radius: 50%; background: conic-gradient(from 0deg, rgba(255,255,255,.95) 0 10deg, rgba(20,20,20,.65) 10deg 20deg, rgba(255,255,255,.95) 20deg 30deg, rgba(20,20,20,.65) 30deg 40deg, rgba(255,255,255,.95) 40deg 50deg, rgba(20,20,20,.65) 50deg 60deg, rgba(255,255,255,.95) 60deg 70deg, rgba(20,20,20,.65) 70deg 80deg, rgba(255,255,255,.95) 80deg 90deg, rgba(20,20,20,.65) 90deg 100deg, rgba(255,255,255,.95) 100deg 110deg, rgba(20,20,20,.65) 110deg 120deg, rgba(255,255,255,.95) 120deg 130deg, rgba(20,20,20,.65) 130deg 140deg, rgba(255,255,255,.95) 140deg 150deg, rgba(20,20,20,.65) 150deg 160deg, rgba(255,255,255,.95) 160deg 170deg, rgba(20,20,20,.65) 170deg 180deg, rgba(255,255,255,.95) 180deg 190deg, rgba(20,20,20,.65) 190deg 200deg, rgba(255,255,255,.95) 200deg 210deg, rgba(20,20,20,.65) 210deg 220deg, rgba(255,255,255,.95) 220deg 230deg, rgba(20,20,20,.65) 230deg 240deg, rgba(255,255,255,.95) 240deg 250deg, rgba(20,20,20,.65) 250deg 260deg, rgba(255,255,255,.95) 260deg 270deg, rgba(20,20,20,.65) 270deg 280deg, rgba(255,255,255,.95) 280deg 290deg, rgba(20,20,20,.65) 290deg 300deg, rgba(255,255,255,.95) 300deg 310deg, rgba(20,20,20,.65) 310deg 320deg, rgba(255,255,255,.95) 320deg 330deg, rgba(20,20,20,.65) 330deg 340deg, rgba(255,255,255,.95) 340deg 350deg, rgba(20,20,20,.65) 350deg 360deg); opacity: .55; mix-blend-mode: multiply; animation: wheelSpin .28s linear infinite; }
    .rallyWheelRear { left: 1.4em; }
    .rallyWheelFront { left: 5.45em; }
    @keyframes driveAcross { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 9em)); } }
    @keyframes wheelSpin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .rallyCar { animation-duration: 18s; } .rallyWheel { animation-duration: 1.2s; } }
    @media (max-width: 980px) { .auditGrid,.numberGrid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media (max-width: 760px) { .passRow { flex-direction: column; } .hero { min-height: auto; gap: 56px; } nav { justify-content: flex-start; } .heroGrid,.sourceBand,.detailGrid { grid-template-columns: 1fr; } .tabLabels { grid-template-columns: repeat(2,minmax(0,1fr)); } .auditGrid,.numberGrid { grid-template-columns: 1fr; } .actions a { width: 100%; } h1 { font-size: clamp(36px,13vw,68px); } .titleLine { white-space: normal; } }
  </style>
</head>

      const enc = new TextEncoder();
      const material = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(payload.salt), iterations: 250000, hash: "SHA-256" }, material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

      return new TextDecoder().decode(plain);
    }
    window.selectTab = function selectTab(tab) {
      document.querySelectorAll(".tabButton").forEach((item) => item.classList.toggle("active", item.dataset.tab === tab));
      document.querySelectorAll(".tabPanel").forEach((panel) => panel.classList.toggle("active", panel.dataset.panel === tab));
    };
    document.addEventListener("click", (event) => {
      const button = event.target.closest(".tabButton");
      if (!button) return;
      selectTab(button.dataset.tab);
    });
    document.getElementById("unlockForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const error = document.getElementById("error");
      error.textContent = "";
      try {
        const html = await decrypt(document.getElementById("password").value);
        document.getElementById("lock").remove();
        document.getElementById("content").innerHTML = html;
        document.body.classList.add("unlocked");
        selectTab("0");
        sessionStorage.setItem("sf2027-unlocked", "yes");
      } catch {
        error.textContent = "パスワードが違います。";
      }
    });
  </script>
</body>
</html>
