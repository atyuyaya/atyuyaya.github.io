---
layout: default
---

{% unless page.url == "/" %}
  <header class="page-header">
    <p class="eyebrow">{{ page.permalink | default: page.url | remove: "/" | default: "Home" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p>{{ page.description }}</p>
    {% endif %}
  </header>
{% endunless %}

<article class="page-content">
  {{ content }}
</article>
