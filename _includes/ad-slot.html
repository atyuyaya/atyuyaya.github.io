{% assign slot_key = include.label | default: "default" | replace: "-", "_" %}
{% assign slot_id = site.adsense.slots[slot_key] %}
{% if site.adsense.client %}
  {% unless slot_id == "" or slot_id == nil %}
    <aside class="ad-slot ad-slot--active" aria-label="広告">
      <ins class="adsbygoogle"
        style="display:block"
        data-ad-client="{{ site.adsense.client }}"
        data-ad-slot="{{ slot_id }}"
        data-ad-format="auto"
        data-full-width-responsive="true"></ins>
      <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </aside>
  {% endunless %}
{% endif %}
